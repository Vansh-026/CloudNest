version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: ../docker/Dockerfile.client
    container_name: cloudnest-client
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    container_name: cloudnest-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - ./server:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: cloudnest-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
